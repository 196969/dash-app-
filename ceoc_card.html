<div class="card elev-sm" style="gap: var(--space-2);" data-ceoc="KIND">
  <div style="display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap;">
    <div class="card-title">CEO checklist: {{ ceoc.missedTitle }}</div>
    <div style="flex: 1;"></div>
    <div style="font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent);">{{ ceoc.stateLine }}</div>
  </div>
  <sc-if value="{{ ceoc.noMissed }}"><p class="card-body" style="margin: 0;">Nothing missed. Self-reported and blind checks are still on the checklist.</p></sc-if>
  <sc-for list="{{ LIST }}" as="m" hint-placeholder-count="5">
    <div style="display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--color-divider);">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: var(--state-bad); display: inline-block; flex: none;"></span>
      <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1 1 240px;"><span style="font-size: 13px;">{{ m.text }}</span><span style="font-size: 11px; color: color-mix(in srgb, var(--color-text) 50%, transparent);">{{ m.basis }}</span></div>
      <span style="font-size: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); white-space: nowrap;">{{ m.area }}</span>
    </div>
  </sc-for>
  MORE
  <div><button class="btn btn-secondary" sc-camel-on-click="{{ ceoc.go }}"><i class="ph ph-list-checks"></i> Open the CEO checklist</button></div>
</div>
