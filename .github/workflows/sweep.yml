# The standing sweep (Item 485): on every push to the Dash branch, the CEO area and the ten standalones are swept.
# The control runs first and must catch its planted faults; then the full sweep must pass. A red run means do not ship.
name: Sweep
on:
  push:
    branches: [branch]
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the browser and the workbook reader
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          pip install openpyxl==3.1.5
      - name: Control — the sweep must catch planted faults
        run: python3 sweep/sweep.py --control
      - name: Full sweep — CEO area, the ten standalones and every sidebar dropdown
        run: python3 sweep/sweep.py
